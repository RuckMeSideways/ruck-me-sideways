# Place this file at: .github/workflows/update-international-data.yml
# Requires a repo secret named APISPORTS_KEY (Settings > Secrets and
# variables > Actions > New repository secret).
name: Update international rugby data

on:
  schedule:
    - cron: '30 5 * * 1'   # weekly, Monday 05:30 UTC - keeps well within the 100 req/day free quota
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-international-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch international rugby data
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python scripts/update_international.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/international/
          if git diff --cached --quiet; then
            echo "No international data changes"
          else
            git commit -m "Update international rugby data $(date -u +'%Y-%m-%d')"
            git push
          fi
