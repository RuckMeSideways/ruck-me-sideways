<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.json"><title>Ruck Me Sideways v8</title><style>
body{margin:0;font-family:system-ui;background:#0b1220;color:#eef2f7}header{padding:16px;background:#111b2e}h1{margin:0;font-size:23px}.sub{color:#aab7ca;font-size:12px}nav{display:flex;gap:7px;overflow:auto;padding:9px;background:#0f1727;position:sticky;top:0}button{border:0;border-radius:9px;padding:10px 13px;background:#1f6feb;color:white;font-weight:700}.tab{display:none;max-width:1100px;margin:auto;padding:14px}.tab.active{display:block}.card{background:#121d30;border:1px solid #293850;border-radius:14px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px}input,select{background:#0b1220;color:white;border:1px solid #3a4962;border-radius:8px;padding:10px;width:100%;box-sizing:border-box}.field{display:flex;flex-direction:column;gap:5px}.field label,.muted{color:#aab7ca}.row{display:flex;gap:8px;flex-wrap:wrap}.result{padding:12px;border:1px solid #293850;border-radius:10px;margin:8px 0}.score{text-align:center;font-size:34px;font-weight:800}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #293850;text-align:left}th{color:#aab7ca}.rating{font-size:26px;font-weight:800}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#4b3b0a;font-size:11px}
</style></head><body>
<header><h1>🏉 Ruck Me Sideways</h1><div class="sub">v8 · Proper Rugby Match Search & Analysis</div></header>
<nav><button onclick="tab('search')">🔎 Find Match</button><button onclick="tab('analysis')">📊 Analysis</button><button onclick="tab('players')">👤 Players</button><button onclick="tab('graphics')">🎥 Graphics</button></nav>
<section id="search" class="tab active"><div class="card"><h2>Find a Match</h2><p class="muted">Search the public rugbypy team registry. Nicknames such as Springboks are resolved to the official team name.</p><div class="grid"><div class="field"><label>Team / nickname</label><input id="q" placeholder="South Africa or Springboks"></div><div class="field"><label>Season</label><select id="season"><option value="">Any</option><option>2026</option><option>2025</option><option>2024</option><option>2023</option><option>2022</option></select></div><div class="field"><label>Competition</label><input id="comp" placeholder="International Test Match, URC..."></div></div><div class="row" style="margin-top:10px"><button onclick="search()">Find Team</button><button onclick="demo()">Demo</button></div></div><div id="teams" class="card"><span class="muted">Enter a team name.</span></div><div id="matches" class="card" style="display:none"></div></section>
<section id="analysis" class="tab"><div class="card"><h2 id="title">No match loaded</h2><div id="meta" class="muted"></div><div id="score" class="score">—</div></div><div id="stats"></div></section>
<section id="players" class="tab"><div class="card"><h2>Player Ratings</h2><div id="summary" class="muted">Load a match first.</div></div><div class="card"><div id="ptable"></div></div></section>
<section id="graphics" class="tab"><div class="card"><h2>YouTube Graphic</h2><div class="row"><button onclick="graphic('score')">Score</button><button onclick="graphic('players')">Player of Match</button><button onclick="graphic('defence')">Defence</button><button onclick="save()">Download PNG</button></div><canvas id="cv" width="1280" height="720" style="width:100%;margin-top:12px"></canvas></div></section>
<script>
const RAW='https://raw.githubusercontent.com/seanyboi/rugbydata/main/data/v3/';
const aliases={'springboks':'South Africa','boks':'South Africa','rsa':'South Africa','all blacks':'New Zealand','allblacks':'New Zealand','wallabies':'Australia','pumas':'Argentina','los pumas':'Argentina','les bleus':'France'};
let current=null,players=[];
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const get=async u=>{let r=await fetch(u);if(!r.ok)throw Error(r.status);return r.json()};
const tab=id=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')};
const fmt=d=>{let s=String(d||'');return s.length===8?s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6):s};
async function search(){
 let q=norm(document.getElementById('q').value);if(!q)return;
 let canonical=aliases[q]||document.getElementById('q').value.trim();
 let box=document.getElementById('teams');box.innerHTML='<b>Searching team registry…</b>';
 try{
  // Registry data used by rugbypy is exposed by the public data repository. Try common registry JSON locations.
  const urls=[RAW+'team/teams.json',RAW+'team/team.json',RAW+'teams.json'];
  let data=null;
  for(const u of urls){try{data=await get(u);if(data)break}catch(e){}}
  if(Array.isArray(data)){
   let hits=data.filter(x=>norm(x.team_name||x.name||x.team).includes(norm(canonical)));
   if(hits.length){box.innerHTML='<h3>Teams found</h3>'+hits.slice(0,10).map(x=>'<div class="result"><b>'+ (x.team_name||x.name||x.team)+'</b><div class="muted">ID: '+(x.team_id||x.id||'—')+'</div><button onclick=matches("'+(x.team_name||x.name||x.team).replace(/"/g,'&quot;')+'")>Find Matches</button></div>').join('');return}
  }
  const internationals=['South Africa','New Zealand','Australia','Argentina','France','Ireland','England','Wales','Scotland','Italy','Georgia','Japan'];
  if(internationals.includes(canonical)){
   box.innerHTML='<h3>Team recognised</h3><div class="result"><b>'+canonical+'</b><div class="muted">Alias resolved from “'+document.getElementById('q').value+'”.</div><button onclick=matches("'+canonical+'")>Find Matches</button></div>';
  }else box.innerHTML='<b>No team found.</b><p class="muted">Try a full official name or common nickname.</p>';
 }catch(e){box.innerHTML='<b>Data registry could not be read from this browser.</b><p class="muted">The public rugbypy package itself documents a team registry and match registry, but GitHub Pages cannot run the Python package directly.</p>'}
}
async function matches(name){
 let box=document.getElementById('matches');box.style.display='block';box.innerHTML='<b>Loading matches for '+name+'…</b>';
 try{
  const urls=[RAW+'match/matches.json',RAW+'match/match.json',RAW+'matches.json'];
  let data=null;for(const u of urls){try{data=await get(u);if(data)break}catch(e){}}
  if(!Array.isArray(data)){box.innerHTML='<b>Match registry format unavailable to the browser.</b><p class="muted">The data exists in rugbypy, but v8 needs the registry mirrored as browser-readable JSON. The app will not fabricate results.</p>';return}
  let q=norm(name),season=document.getElementById('season').value,comp=norm(document.getElementById('comp').value);
  let out=data.filter(m=>(norm(m.home_team).includes(q)||norm(m.away_team).includes(q))&&(!season||String(m.date||'').startsWith(season))&&(!comp||norm(m.competition).includes(comp))).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  box.innerHTML=out.length?'<h3>'+name+' matches</h3>'+out.slice(0,50).map(m=>'<div class="result"><b>'+m.home_team+' '+(m.home_score??'')+' – '+(m.away_score??'')+' '+m.away_team+'</b><div class="muted">'+fmt(m.date)+' · '+(m.competition||'')+'</div><button onclick=load('+JSON.stringify(m).replace(/'/g,'&#39;')+')>Load Match</button></div>').join(''):'<p>No matches found in the browser-readable registry.</p>';
 }catch(e){box.innerHTML='<b>Could not load the match registry.</b><p class="muted">This is a browser data-access limitation, not proof that the match is absent.</p>'}
}
function demo(){current={home_team:'South Africa',away_team:'New Zealand',date:'20260822',competition:'International Test Match',home_score:28,away_score:21,home:{tackles:128,missed_tackles:9,territory:56,turnovers_won:8,turnovers_conceded:6,tries:3,metres_carried:612},away:{tackles:143,missed_tackles:14,territory:44,turnovers_won:6,turnovers_conceded:8,tries:3,metres_carried:655},players:[{name:'Example Player',team:'South Africa',tackles:18,missed:1,metres:72,turnovers_won:3},{name:'Example Player 2',team:'New Zealand',tackles:19,missed:2,metres:55,turnovers_won:2}]};players=current.players;render();tab('analysis')}
async function load(m){current=m;try{if(m.match_id)current={...m,...await get(RAW+'match/'+m.match_id+'.json')}}catch(e){}players=current.players||[];render();tab('analysis')}
function rating(p){let s=5;if(p.tackles!=null)s+=Math.min(2.5,p.tackles/12);if(p.missed!=null)s-=Math.min(1.5,p.missed/6);if(p.metres!=null)s+=Math.min(1.5,p.metres/100);if(p.turnovers_won!=null)s+=Math.min(1.5,p.turnovers_won*.5);return Math.max(0,Math.min(10,s))}
function render(){document.getElementById('title').textContent=current.home_team+' vs '+current.away_team;document.getElementById('meta').textContent=fmt(current.date)+' · '+(current.competition||'');document.getElementById('score').textContent=(current.home_score??'—')+' – '+(current.away_score??'—');let h=current.home||{},a=current.away||{};let rows=[['Tackles',h.tackles,a.tackles],['Missed tackles',h.missed_tackles,a.missed_tackles],['Territory %',h.territory,a.territory],['Turnovers won',h.turnovers_won,a.turnovers_won],['Turnovers conceded',h.turnovers_conceded,a.turnovers_conceded],['Metres carried',h.metres_carried,a.metres_carried],['Tries',h.tries,a.tries]];document.getElementById('stats').innerHTML='<div class="card"><table><tr><th>Statistic</th><th>'+current.home_team+'</th><th>'+current.away_team+'</th></tr>'+rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+(r[1]??'—')+'</td><td>'+(r[2]??'—')+'</td></tr>').join('')+'</table></div>';renderPlayers()}
function renderPlayers(){if(!players.length){document.getElementById('summary').innerHTML='No player-level data supplied.';document.getElementById('ptable').innerHTML='';return}let s=players.map(p=>({...p,r:rating(p)})).sort((a,b)=>b.r-a.r),top=s[0];document.getElementById('summary').innerHTML='<div class="rating">'+top.name+' — '+top.r.toFixed(1)+'/10</div><span class="badge">Calculated RMS rating</span>';document.getElementById('ptable').innerHTML='<table><tr><th>Player</th><th>Team</th><th>Tackles</th><th>Metres</th><th>TO won</th><th>Rating</th></tr>'+s.map(p=>'<tr><td>'+p.name+'</td><td>'+p.team+'</td><td>'+(p.tackles??'—')+'</td><td>'+(p.metres??'—')+'</td><td>'+(p.turnovers_won??'—')+'</td><td><b>'+p.r.toFixed(1)+'</b></td></tr>').join('')+'</table>'}
function graphic(type){let c=document.getElementById('cv'),x=c.getContext('2d');x.fillStyle='#0b1220';x.fillRect(0,0,1280,720);x.fillStyle='#fff';x.font='bold 42px system-ui';x.fillText('RUCK ME SIDEWAYS',70,80);if(!current){x.fillText('Load a match first',70,160);return}x.font='bold 48px system-ui';x.fillText(current.home_team+' '+(current.home_score??'—')+' – '+(current.away_score??'—')+' '+current.away_team,70,180);x.font='32px system-ui';x.fillText(type==='players'&&players.length?'PLAYER OF THE MATCH':type==='defence'?'DEFENCE BATTLE':'FINAL SCORE',70,330);if(type==='players'&&players.length){let p=players.slice().sort((a,b)=>rating(b)-rating(a))[0];x.font='bold 54px system-ui';x.fillText(p.name+' · '+rating(p).toFixed(1)+'/10',70,410)}else{x.font='30px system-ui';x.fillText('Tackles: '+(current.home?.tackles??'—')+' vs '+(current.away?.tackles??'—'),70,400);x.fillText('Missed: '+(current.home?.missed_tackles??'—')+' vs '+(current.away?.missed_tackles??'—'),70,450)}}
function save(){let a=document.createElement('a');a.download='ruck-me-sideways-v8.png';a.href=document.getElementById('cv').toDataURL();a.click()}
</script></body></html>
